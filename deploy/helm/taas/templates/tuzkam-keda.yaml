{{- if .Values.tuzkam.enabled }}
{{- if not .Values.secrets.loadToken }}
{{- fail "tuzkam.enabled needs secrets.loadToken: KEDA scales TuzkaM on the API's /load" }}
{{- end }}
{{- $m := .Values.tuzkam }}
{{- $name := printf "%s-tuzkam" (include "taas.fullname" .) }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuzkam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ $name }}
  minReplicaCount: {{ $m.minReplicas }}
  maxReplicaCount: {{ $m.maxReplicas }}
  pollingInterval: {{ $m.keda.pollingInterval }}
  cooldownPeriod: {{ $m.keda.cooldownPeriod }}
  triggers:
    # Seconds of queued map work a TuzkaM backend could serve.
    - type: metrics-api
      metadata:
        url: {{ printf "http://%s-api.%s.svc:%v/load?adapter=tuzkam" (include "taas.fullname" .) .Release.Namespace .Values.api.port | quote }}
        valueLocation: backlog_s
        targetValue: {{ $m.keda.targetBacklogSeconds | quote }}
        activationTargetValue: {{ $m.keda.activationBacklogSeconds | quote }}
        authMode: bearer
      authenticationRef:
        name: {{ $name }}-keda-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $name }}-keda-auth
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuzkam
spec:
  secretTargetRef:
    - parameter: token
      name: {{ include "taas.fullname" . }}-secret
      key: LOAD_TOKEN
{{- end }}
