{{- if or .Values.ocrEngine.enabled .Values.tunnelBoxes .Values.tuzkam.enabled }}
{{- $e := .Values.ocrEngine }}
{{- $name := printf "%s-ocr-engine" (include "taas.fullname" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taas.fullname" . }}-backend-register
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-register
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "taas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          # The api image carries taas-admin, which writes the backends straight to the DB.
          image: {{ include "taas.image" (dict "image" .Values.api.image "global" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "taas.fullname" . }}-config
            - secretRef:
                name: {{ include "taas.fullname" . }}-secret
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for the DB (and the migrations) rather than the API.
              echo "waiting for the database..."
              until taas-admin config list >/dev/null 2>&1; do sleep 3; done
              {{- if $.Values.ocrEngine.enabled }}
              {{- $max := int $e.autoscaling.maxReplicas }}
              {{- range $i := until $max }}
              URL="http://{{ $name }}-{{ $i }}.{{ $name }}:{{ $e.port }}"
              echo "registering ocr-engine-{{ $i }} -> $URL"
              taas-admin backend upsert --url "$URL" --label "ocr-engine-{{ $i }}" \
                --api-key-env OCR_ENGINE_API_KEY --max-inflight {{ $e.maxInflight }} \
                --adapter tuzkaocr --managed \
                --declared {{ $e.declaredDomains | toJson | squote }} >/dev/null \
                || echo "upsert ocr-engine-{{ $i }} failed"
              {{- end }}
              {{- end }}
              {{- range $box := $.Values.tunnelBoxes }}
              {{- range $te := ($box.engines | default list) }}
              {{- $tcfg := mergeOverwrite (deepCopy $.Values.tunnelBoxesDefaults) (deepCopy $te) }}
              {{- $tname := printf "%s-%s" $box.name $te.name }}
              {{- $tsvc := include "taas.tunnelEngineService" (dict "root" $ "box" $box.name "engine" $te.name) }}
              {{- $turl := printf "http://%s:%v" $tsvc $tcfg.port }}
              echo "registering tunnel engine {{ $tname }} -> {{ $turl }}"
              taas-admin backend upsert --url "{{ $turl }}" --label "{{ $tname }}" \
                --api-key-env OCR_ENGINE_API_KEY --max-inflight {{ $tcfg.maxInflight }} \
                --device "{{ $tcfg.device }}" --adapter tuzkaocr --managed >/dev/null \
                || echo "upsert {{ $tname }} failed"
              {{- end }}
              {{- end }}
              {{- if $.Values.tuzkam.enabled }}
              {{- $m := $.Values.tuzkam }}
              {{- $mname := printf "%s-tuzkam" (include "taas.fullname" $) }}
              {{- range $i := until (int $m.maxReplicas) }}
              URL="http://{{ $mname }}-{{ $i }}.{{ $mname }}:{{ $m.port }}"
              echo "registering tuzkam-{{ $i }} -> $URL"
              taas-admin backend upsert --url "$URL" --label "tuzkam-{{ $i }}" \
                --api-key-env TUZKAM_API_KEY --max-inflight {{ $m.maxInflight }} \
                --adapter tuzkam --managed \
                --declared '{"maps": ["json", "geojson", "gcp", "alto", "txt"]}' >/dev/null \
                || echo "upsert tuzkam-{{ $i }} failed"
              {{- end }}
              {{- end }}
              echo "done"
{{- end }}
