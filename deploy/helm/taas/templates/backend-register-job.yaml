{{- $engines := include "taas.engines" . | fromYamlArray -}}
{{- $full := include "taas.fullname" . -}}
{{- $tunnelDefaultSecret := printf "%s-tunnel-engine-key" $full -}}
{{- if or $engines .Values.tunnelBoxes }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-backend-register
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-register
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "taas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          # The api image carries taas-admin, which writes the backends straight to the DB.
          image: {{ include "taas.image" (dict "image" .Values.api.image "global" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
            Engine keys are explicit secretKeyRefs, never part of envFrom. That keeps
            them out of every other app pod and lets the Secret key name be anything;
            the env var below is just a register-job alias.
          */}}
          {{- /*
            TAAS_NO_ENGINE_KEY is deliberately empty: passing its alias to
            `taas-admin backend upsert` clears a key left on a managed backend from a
            previous release. Omitting --api-key-env would keep that stale key.
          */}}
          {{- $keyEnvs := list (dict "name" "TAAS_NO_ENGINE_KEY" "value" "") }}
          {{- range $i, $e := $engines }}
          {{- with $e.auth }}
          {{- $keyEnvs = append $keyEnvs (dict "name" (printf "TAAS_ENGINE_KEY_%d" $i) "secretName" .secretName "secretKey" .secretKey) }}
          {{- end }}
          {{- end }}
          {{- range $bi, $box := .Values.tunnelBoxes }}
          {{- range $ti, $te := ($box.engines | default list) }}
          {{- $tcfg := mergeOverwrite (deepCopy $.Values.tunnelBoxesDefaults) (deepCopy $te) }}
          {{- $tauth := include "taas.auth" (dict
            "root" $
            "name" (printf "%s-%s" $box.name $te.name)
            "path" (printf "tunnelBoxes[%s].engines[%s]" $box.name $te.name)
            "auth" ($tcfg.auth | default dict)
            "requireEnv" false
            "allowGenerate" false
            "defaultSecretName" $tunnelDefaultSecret
          ) | fromYaml }}
          {{- with $tauth }}
          {{- $keyEnvs = append $keyEnvs (dict "name" (printf "TAAS_TUNNEL_KEY_%d_%d" $bi $ti) "secretName" .secretName "secretKey" .secretKey) }}
          {{- end }}
          {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $full }}-config
            - secretRef:
                name: {{ $full }}-secret
          {{- with $keyEnvs }}
          env:
            {{- range . }}
            - name: {{ .name }}
              {{- if .secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
              {{- else }}
              value: ""
              {{- end }}
            {{- end }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for the DB (and the migrations) rather than the API.
              echo "waiting for the database..."
              until taas-admin config list >/dev/null 2>&1; do sleep 3; done
              {{- range $i, $e := $engines }}
              {{- $max := int $e.autoscaling.maxReplicas }}
              {{- if eq $e.autoscaling.mode "none" }}
              {{- $max = int $e.autoscaling.replicas }}
              {{- end }}
              {{- $apiKeyArg := "--api-key-env TAAS_NO_ENGINE_KEY" }}
              {{- with $e.auth }}
              {{- $apiKeyArg = printf "--api-key-env TAAS_ENGINE_KEY_%d" $i }}
              {{- end }}
              {{- $deviceArg := "" }}
              {{- with $e.device }}
              {{- $deviceArg = printf "--device %q" . }}
              {{- end }}
              {{- $declaredArg := "" }}
              {{- if $e.declaredDomains }}
              {{- $declaredArg = printf "--declared %s" ($e.declaredDomains | toJson | squote) }}
              {{- end }}
              {{- range $i := until $max }}
              URL="http://{{ $full }}-{{ $e.name }}-{{ $i }}.{{ $full }}-{{ $e.name }}:{{ $e.port }}"
              echo "registering {{ $e.name }}-{{ $i }} -> $URL"
              taas-admin backend upsert --url "$URL" --label "{{ $e.name }}-{{ $i }}" \
                {{ $apiKeyArg }} --max-inflight {{ $e.maxInflight }} \
                --adapter {{ $e.adapter }} --managed {{ $deviceArg }} {{ $declaredArg }} >/dev/null \
                || echo "upsert {{ $e.name }}-{{ $i }} failed"
              {{- end }}
              {{- end }}
              {{- range $bi, $box := $.Values.tunnelBoxes }}
              {{- range $ti, $te := ($box.engines | default list) }}
              {{- $tcfg := mergeOverwrite (deepCopy $.Values.tunnelBoxesDefaults) (deepCopy $te) }}
              {{- $tauth := include "taas.auth" (dict
                "root" $
                "name" (printf "%s-%s" $box.name $te.name)
                "path" (printf "tunnelBoxes[%s].engines[%s]" $box.name $te.name)
                "auth" ($tcfg.auth | default dict)
                "requireEnv" false
                "allowGenerate" false
                "defaultSecretName" $tunnelDefaultSecret
              ) | fromYaml }}
              {{- $tname := printf "%s-%s" $box.name $te.name }}
              {{- $tsvc := include "taas.tunnelEngineService" (dict "root" $ "box" $box.name "engine" $te.name) }}
              {{- $turl := printf "http://%s:%v" $tsvc $tcfg.port }}
              {{- $apiKeyArg := "--api-key-env TAAS_NO_ENGINE_KEY" }}
              {{- with $tauth }}
              {{- $apiKeyArg = printf "--api-key-env TAAS_TUNNEL_KEY_%d_%d" $bi $ti }}
              {{- end }}
              echo "registering tunnel engine {{ $tname }} -> {{ $turl }}"
              taas-admin backend upsert --url "{{ $turl }}" --label "{{ $tname }}" \
                {{ $apiKeyArg }} --max-inflight {{ $tcfg.maxInflight }} \
                --device "{{ $tcfg.device }}" --adapter tuzkaocr --managed >/dev/null \
                || echo "upsert {{ $tname }} failed"
              {{- end }}
              {{- end }}
              echo "done"
{{- end }}
