{{- /*
  API-key Secrets for tunnel engines whose auth has a value (tunnelBoxesDefaults.auth
  or a per-engine override): one per engine, <release>-tunnel-engine-<box>-<engine>-key.
  The box's engine must use the same key.
*/ -}}
{{- range $box := .Values.tunnelBoxes }}
{{- range $te := ($box.engines | default list) }}
{{- $tcfg := mergeOverwrite (deepCopy $.Values.tunnelBoxesDefaults) (deepCopy $te) }}
{{- $tauth := include "taas.auth" (dict
  "root" $
  "name" (printf "%s-%s" $box.name $te.name)
  "path" (printf "tunnelBoxes[%s].engines[%s]" $box.name $te.name)
  "auth" ($tcfg.auth | default dict)
  "requireEnv" false
  "allowGenerate" false
  "defaultSecretName" (printf "%s-tunnel-engine-key" (include "taas.fullname" $))
) | fromYaml }}
{{- if $tauth.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tauth.secretName }}
  labels:
    {{- include "taas.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tunnel-engine
type: Opaque
stringData:
  {{ $tauth.secretKey }}: {{ $tauth.value | quote }}
{{- end }}
{{- end }}
{{- end }}
