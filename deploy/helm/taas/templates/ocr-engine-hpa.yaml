{{- if .Values.ocrEngine.enabled }}
{{- $e := .Values.ocrEngine }}
{{- $name := printf "%s-ocr-engine" (include "taas.fullname" .) }}
{{- if eq $e.autoscaling.mode "hpa" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ $name }}
  minReplicas: {{ $e.autoscaling.minReplicas }}
  maxReplicas: {{ $e.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $e.autoscaling.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $e.autoscaling.hpa.scaleDownStabilizationSeconds }}
{{- else if eq $e.autoscaling.mode "keda" }}
{{- if not .Values.secrets.loadToken }}
{{- fail "ocrEngine.autoscaling.mode=keda needs secrets.loadToken: KEDA reads the API's /load with it" }}
{{- end }}
{{- $k := $e.autoscaling.keda }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ $name }}
  minReplicaCount: {{ $e.autoscaling.minReplicas }}
  maxReplicaCount: {{ $e.autoscaling.maxReplicas }}
  pollingInterval: {{ $k.pollingInterval }}
  cooldownPeriod: {{ $k.cooldownPeriod }}
  triggers:
    # The API's /load: seconds of queued work this engine could serve (backlog_s).
    - type: metrics-api
      metadata:
        url: {{ printf "http://%s-api.%s.svc:%v/load?%s" (include "taas.fullname" .) .Release.Namespace .Values.api.port $k.loadFilter | quote }}
        valueLocation: backlog_s
        targetValue: {{ $k.targetBacklogSeconds | quote }}
        activationTargetValue: {{ $k.activationBacklogSeconds | quote }}
        authMode: bearer
      authenticationRef:
        name: {{ $name }}-keda-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $name }}-keda-auth
  labels:
    {{- include "taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-engine
spec:
  secretTargetRef:
    - parameter: token
      name: {{ include "taas.fullname" . }}-secret
      key: LOAD_TOKEN
{{- end }}
{{- end }}
