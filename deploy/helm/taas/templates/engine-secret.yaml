{{- /*
  Dedicated API-key Secrets for engines with auth.generate: true.

  The key is generated once and preserved on later upgrades via lookup. It is
  deliberately separate from <release>-secret: only the engine pod and the
  short-lived backend-register hook need the raw key. For GitOps (Argo CD, Flux)
  prefer auth.existingSecret managed by External Secrets / SealedSecrets / Vault,
  because lookup-based generation is not reproducible by `helm template`.
*/ -}}
{{- $engines := include "taas.engines" . | fromYamlArray -}}
{{- range $e := $engines }}
{{- if $e.auth.generated }}
{{- $name := $e.auth.secretName }}
{{- $key := "" }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- if $existing }}
{{- if not (hasKey $existing.data $e.auth.secretKey) }}
{{- fail (printf "engines.%s: generated Secret %q exists but has no key %q; delete it or set auth.existingSecret" $e.name $name $e.auth.secretKey) }}
{{- end }}
{{- $key = index $existing.data $e.auth.secretKey | b64dec }}
{{- if not $key }}
{{- fail (printf "engines.%s: generated Secret %q has an empty %q key" $e.name $name $e.auth.secretKey) }}
{{- end }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "taas.labels" $ | nindent 4 }}
    app.kubernetes.io/component: engine
    taas.io/engine: {{ $e.name }}
  annotations:
    taas.io/generated: "true"
type: Opaque
stringData:
  {{ $e.auth.secretKey }}: {{ $key | quote }}
{{- end }}
{{- end }}
