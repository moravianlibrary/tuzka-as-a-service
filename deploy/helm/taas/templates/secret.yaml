apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taas.fullname" . }}-secret
  labels:
    {{- include "taas.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-rw:5432/%s" .Values.cnpg.owner .Values.secrets.postgresPassword .Values.cnpg.name .Values.cnpg.database | quote }}
  LOAD_TOKEN: {{ .Values.secrets.loadToken | quote }}
  KEY_ENCRYPTION_SECRET: {{ .Values.secrets.keyEncryptionSecret | quote }}
  MINIO_INCOMING_ACCESS_KEY: {{ .Values.secrets.minioIncomingAccessKey | quote }}
  MINIO_INCOMING_SECRET_KEY: {{ .Values.secrets.minioIncomingSecretKey | quote }}
  MINIO_RESULTS_ACCESS_KEY: {{ .Values.secrets.minioResultsAccessKey | quote }}
  MINIO_RESULTS_SECRET_KEY: {{ .Values.secrets.minioResultsSecretKey | quote }}
  {{- if .Values.clickstack.enabled }}
  {{- if not .Values.secrets.clickhousePassword }}
  {{- fail "clickstack.enabled needs secrets.clickhousePassword" }}
  {{- end }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | quote }}
  # A HyperDX user's API key, for the dashboard import; empty until someone signed up.
  HYPERDX_API_KEY: {{ .Values.secrets.hyperdxApiKey | default "" | quote }}
  # HyperDX's ClickHouse connection, created with the team at the first sign-up. Here,
  # not in the Deployment, because it carries the password.
  HYPERDX_DEFAULT_CONNECTIONS: {{ list (dict "name" "taas ClickHouse" "host" (printf "http://%s-clickhouse:8123" (include "taas.fullname" .)) "port" 8123 "username" .Values.clickstack.clickhouse.user "password" .Values.secrets.clickhousePassword) | toJson | quote }}
  {{- end }}
  {{- if .Values.tunnel.enabled }}
  FRP_TOKEN: {{ .Values.secrets.frpToken | quote }}
  {{- end }}
