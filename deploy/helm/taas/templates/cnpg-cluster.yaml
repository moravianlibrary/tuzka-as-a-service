apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  labels:
    {{- include "taas.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}

  {{- if .Values.cnpg.pgStatStatements }}
  # Setting any pg_stat_statements.* parameter makes CNPG preload the library and
  # create the extension itself (the app user isn't a superuser).
  postgresql:
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: top
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
      secret:
        name: {{ include "taas.fullname" . }}-cnpg-auth

  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- if .Values.cnpg.storage.storageClassName }}
    storageClass: {{ .Values.cnpg.storage.storageClassName | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
