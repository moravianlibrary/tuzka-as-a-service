# Off-cluster TuzkaOCR engine for a GPU box behind NAT.
#
# Runs the GPU OCR engine + an frpc reverse-tunnel client that dials the in-cluster
# frps server. The box needs only OUTBOUND access to <FRP_SERVER_ADDR>:<FRP_SERVER_PORT>
# (the taas <release>-frps NodePort). Configure via a .env file (see .env.example).
#
# Two ways to get the engine, selected by COMPOSE_PROFILES in .env (default: registry):
#   registry -> pull a prebuilt image (OCR_IMAGE):   docker compose up -d
#   build    -> build from a local checkout in ./TuzkaOCR:
#               docker compose --profile build up -d --build
# frpc runs under both profiles. The build service exposes the network alias "tuzkaocr"
# so frpc reaches it the same way regardless of mode.

# Shared engine config (both run modes). YAML merge via <<. CPU by default — the
# NVIDIA device reservation lives in compose.gpu.yaml so a CPU-only box can run
# `docker compose up` without the nvidia-container-toolkit. For a GPU box, add the
# overlay: `docker compose -f compose.yaml -f compose.gpu.yaml up -d`.
x-tuzkaocr-common: &tuzkaocr-common
  restart: unless-stopped
  environment:
    # MUST match the cluster's secrets.ocrEngineApiKey so taas can authenticate.
    TUZKAOCR_API_KEY: ${OCR_API_KEY:?set OCR_API_KEY in .env}
    TUZKAOCR_DEVICE: ${OCR_DEVICE:-cpu}
  # No published ports: the engine is reached ONLY through the tunnel.
  expose:
    - "8000"

services:
  # Option A — prebuilt image from a registry.
  tuzkaocr:
    <<: *tuzkaocr-common
    profiles: ["registry"]
    image: ${OCR_IMAGE:-registry.gitlab.mzk.cz/osdd/image/tuzka-as-a-service/tuzkaocr:1.3.0}

  # Option B — build from a local repo checkout in ./TuzkaOCR.
  tuzkaocr-build:
    <<: *tuzkaocr-common
    profiles: ["build"]
    image: ${OCR_IMAGE:-tuzkaocr:local}
    build:
      context: ${OCR_BUILD_CONTEXT:-./TuzkaOCR}
      dockerfile: ${OCR_DOCKERFILE:-Dockerfile}
    # Reachable as "tuzkaocr" (what frpc.toml points at) even though the service name differs.
    networks:
      default:
        aliases: ["tuzkaocr"]

  # cAdvisor — per-box container metrics, scraped by the cluster Prometheus through the
  # same frpc tunnel (see FRP_CADVISOR_REMOTE_PORT). Reachable only on the internal
  # compose network (expose only); the cluster reaches it via the tunnel-box Service.
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    profiles: ["registry", "build"]
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose: ["8080"]

  # Dispatch gate — the tunnel's endpoint, proxying to the engine. Always present and a
  # plain pass-through unless the scheduler closes it; closed, it 503s /healthz and
  # POST /api/v1/process (so taas stops dispatching) while still passing status/result
  # through (so in-flight pages can be harvested). See gate/nginx.conf.
  gate:
    image: ${GATE_IMAGE:-nginx:1.27-alpine}
    profiles: ["registry", "build"]
    restart: unless-stopped
    volumes:
      - ./gate/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - gate-state:/gate:ro
    expose: ["8000"]

  # Up-hours scheduler — closes the gate and stops the engine outside a weekly schedule,
  # so a box that has a day job (work PC, shared workstation) only serves OCR off-hours.
  # Inert by default (OCR_UP_SCHEDULE=always). Drives the host daemon through the docker
  # socket; it only touches containers labelled with THIS compose project. See README.
  scheduler:
    build:
      context: ./scheduler
    image: ${SCHEDULER_IMAGE:-taas-box-scheduler:local}
    profiles: ["registry", "build"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gate-state:/gate
    environment:
      # Timezone the schedule is written in — without it the container runs on UTC.
      TZ: ${TZ:-UTC}
      # "always" (default) | "never" | windows, e.g. "Mon-Fri 17:30-07:30; Sat,Sun 00:00-24:00"
      OCR_UP_SCHEDULE: ${OCR_UP_SCHEDULE:-always}
      # Grace between closing the gate (dispatch stops) and stopping the engine — how
      # long in-flight pages have to finish and be harvested through the open tunnel.
      OCR_DRAIN_MINUTES: ${OCR_DRAIN_MINUTES:-10}
      OCR_POLL_SECONDS: ${OCR_POLL_SECONDS:-60}
      OCR_STOP_TIMEOUT: ${OCR_STOP_TIMEOUT:-120}
      # 1 = also stop frpc after the engine. Off by default: the tunnel is idle-cheap and
      # keeping it up leaves the box's cAdvisor/GPU metrics visible to the cluster.
      OCR_STOP_TUNNEL: ${OCR_STOP_TUNNEL:-0}
      # Compose services to control. Both engine profiles are listed: whichever one
      # isn't running simply matches no containers. Override for a multi-engine box.
      SCHED_ENGINE_SERVICES: ${SCHED_ENGINE_SERVICES:-tuzkaocr,tuzkaocr-build}
      SCHED_TUNNEL_SERVICES: ${SCHED_TUNNEL_SERVICES:-frpc}
      SCHED_GATE_SERVICES: ${SCHED_GATE_SERVICES:-gate}
      # Auto-detected from this container's own compose label; set only if that fails.
      SCHED_PROJECT: ${COMPOSE_PROJECT_NAME:-}

  frpc:
    image: ${FRPC_IMAGE:-snowdreamtech/frpc:0.61.1}
    profiles: ["registry", "build"]
    restart: unless-stopped
    # No depends_on: frp keeps retrying the local engine until it answers, so this
    # works whichever engine service (registry or build) is active.
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR:?set FRP_SERVER_ADDR (a cluster node IP) in .env}
      FRP_SERVER_PORT: ${FRP_SERVER_PORT:-32700}
      FRP_TOKEN: ${FRP_TOKEN:?set FRP_TOKEN (== cluster secrets.frpToken) in .env}
      # Box name — used to prefix the exporter proxy names so they stay unique across boxes.
      BOX_NAME: ${BOX_NAME:-box1}
      FRP_PROXY_NAME: ${ENGINE_NAME:-gpu1}
      # What the tunnel delivers to. Default is the gate (pass-through unless the
      # scheduler closes it); set FRP_LOCAL_IP=tuzkaocr to bypass the gate entirely.
      FRP_LOCAL_IP: ${FRP_LOCAL_IP:-gate}
      # The port TuzkaOCR listens on inside its container (fixed by the image), and the
      # port the gate listens on — same either way.
      FRP_LOCAL_PORT: "8000"
      FRP_REMOTE_PORT: ${REMOTE_PORT:?set REMOTE_PORT (== this engine's tunnelBoxes[].engines[].remotePort) in .env}
      # Optional exporter tunnels. Leave unset on a box without exporters — the matching
      # frpc.toml blocks are then skipped. Must match the box's tunnelBoxes[].exporters[].remotePort.
      FRP_CADVISOR_REMOTE_PORT: ${FRP_CADVISOR_REMOTE_PORT:-}
      FRP_GPU_EXPORTER_REMOTE_PORT: ${FRP_GPU_EXPORTER_REMOTE_PORT:-}

volumes:
  # One flag file, written by the scheduler and read by the gate. A named volume (not a
  # bind mount) so the gate's state survives container recreation without leaving
  # anything behind on the host.
  gate-state:
