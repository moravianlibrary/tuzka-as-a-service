# Dispatch gate — sits between frpc and the engine so the box can stop taking NEW work
# without going dark on work it already has.
#
# The scheduler closes the gate by creating /gate/closed (shared volume). While closed:
#   /healthz            -> 503, so taas's pre-dispatch health check drops this backend
#                          out of rotation within settings.health_cache_seconds (10s)
#   POST /api/v1/process -> 503, closing the race with a dispatch already in flight
#   everything else      -> passes through, so the poller can still read /api/v1/status
#                          and fetch /api/v1/result for pages the engine is finishing
# Open (the default, and the only state when OCR_UP_SCHEDULE=always), it is a plain
# pass-through.

server {
    listen 8000;

    # Resolve the engine per-request via docker's embedded DNS: with a literal name in
    # proxy_pass nginx resolves at startup and refuses to boot while the engine
    # container is stopped — which is exactly the state the scheduler puts it in.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $engine http://tuzkaocr:8000;

    # Page images are streamed straight through: no size cap, no request buffering
    # (nginx would otherwise spool the whole upload to disk before contacting the
    # engine, which already spools it itself since TuzkaOCR v1.7.0).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_http_version 1.1;

    default_type text/plain;

    location = /healthz {
        if (-f /gate/closed) {
            return 503 "gate closed: box is outside its OCR up-window\n";
        }
        proxy_pass $engine$request_uri;
    }

    location = /api/v1/process {
        if (-f /gate/closed) {
            return 503 "gate closed: box is outside its OCR up-window\n";
        }
        proxy_pass $engine$request_uri;
    }

    location / {
        proxy_pass $engine$request_uri;
    }
}
