[project]
name = "taas"
version = "0.9.0"
requires-python = ">=3.13"
# Base = what the workers need (no web framework). The API/dashboard web stack is
# the `api` extra, so the worker image stays lean: `pip install .` for workers,
# `pip install .[api]` for the api image (and local API dev).
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "miniopy-async>=1.19",
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic-settings>=2.2",
  "zstandard>=0.22",
  # OpenTelemetry: off unless OTEL_EXPORTER_OTLP_ENDPOINT is set (app/telemetry.py)
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.scripts]
taas-admin = "app.cli.main:app"

[project.optional-dependencies]
# Web/HTTP stack + migrations — only the api image needs these.
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "jsonschema>=4.18",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  # taas-admin, the admin CLI: the api image is the admin image
  "typer>=0.12",
  # taas-admin's tables (typer brings it already; the CLI imports it directly)
  "rich>=13",
  # Image size at submit (header only), for dispatch scoring
  "pillow>=10.0",
]
dev = ["taas[api]", "pytest", "pytest-asyncio", "pytest-cov", "schemathesis", "locust", "ruff", "mypy", "types-jsonschema", "xmlschema", "pytest-benchmark"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100
# TuzkaOCR: vendored engine. bench: throwaway benchmarking scratch. alembic/versions:
# shipped migrations are immutable — we don't reformat them after they land.
extend-exclude = ["TuzkaOCR", "bench", "alembic/versions"]

[tool.ruff.lint]
# C901/PLR0912/PLR0915 cap function size; TD keeps TODOs attributed (TODO(author): …).
# G004: log calls pass their values as arguments (lazy %-formatting), not an f-string,
# so a message's template stays the same from one record to the next.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C901", "PLR0912", "PLR0915", "TD", "G004"]
# TD003: a TODO needs no issue link.
ignore = ["E501", "TD003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI markers and Typer's options are call-in-default by design and are
# effectively immutable singletons; B008 would otherwise fire on every parameter.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Security",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Body",
  "fastapi.Path",
  "typer.Argument",
  "typer.Option",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "compat"]

# Third-party libraries without bundled type stubs. Strict mode treats untyped
# imports as errors; these have no stubs on PyPI, so ignore just their imports.
[[tool.mypy.overrides]]
module = ["miniopy_async", "miniopy_async.*", "zstandard", "zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# tests/perf holds the micro-benchmarks (`make bench-micro`): slow and noisy, so a plain
# `pytest` / `make check` never recurses into them. Naming the directory still runs them.
norecursedirs = [".*", "__pycache__", "perf"]
